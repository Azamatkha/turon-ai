# Turon-AI CI: har push (main) va pull request'da backend testlari hamda
# frontend typecheck + build.
#
# BLOKLAYDIGANLAR: pytest, tsc, vite build — ular yiqilsa CI qizil.
# BLOKLAMAYDIGANLAR: ruff va eslint (continue-on-error). Sababi: kodda
# avvaldan qolgan lint xatolari bor; ular tozalangach `continue-on-error`
# qatorlarini olib tashlang — shunda lint ham majburiy bo'ladi.
#
# Sirlar kerak emas: backend testlari repodagi `backend/.env.test` (test
# qiymatlari) va soxta Redis/DB (tests/fakes) bilan ishlaydi.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/infra/requirements/dev.txt

      - name: Bog'liqliklarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install -r infra/requirements/dev.txt
          # pre-commit'dagi bilan bir xil versiya
          pip install ruff==0.15.11

      - name: Ruff (hozircha bloklamaydi)
        continue-on-error: true
        run: ruff check src tests celery_tasks

      - name: Pytest
        env:
          TESTING: "true"
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint (hozircha bloklamaydi)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build
